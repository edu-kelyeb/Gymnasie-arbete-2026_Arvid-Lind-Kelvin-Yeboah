<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Åva Park</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="toppmeny">
      <a class="logotyp" href="index.html">
        <img src="annat/logo.png" alt="Åva Park" />
      </a>
      <div class="statistik-total">
        <div class="statistik-innehall">
          <p class="antal-total">0</p>
          <span>Totalt</span>
        </div>
      </div>
      <div class="statistik-lediga">
        <span class="indikator"></span>
        <div class="statistik-lediga-innehall">
          <p class="antal-lediga">0</p>
          <span>Lediga</span>
        </div>
      </div>
      <div class="statistik-upptagna">
        <span class="indikator"></span>
        <div class="statistik-upptagna-innehall">
          <p class="antal-upptagna">0</p>
          <span>Upptagna</span>
        </div>
      </div>
      <div class="tillganglighet">
        <div class="tillganglighet-stapel">
          <span class="stapel-lediga"></span>
          <span class="stapel-upptagna"></span>
        </div>
        <p><span class="procent-lediga">0</span>% lediga platser</p>
      </div>
      <button class="meny-knapp" id="filtrera-knapp" type="button">
        Visa lediga platser
      </button>
    </nav>
    <main id="parkeringsomrade">
      <div class="kartyta">
        <img
          class="parkeringsbild"
          src="annat/avaparkering.png"
          alt="Karta över parkeringsplatser"
        />
        <div class="parkeringsplatser"></div>
      </div>
    </main>
    <nav class="bottenmeny">
      <span>Klicka på en plats för att ändra status</span>
      <div class="teckenforklaring">
        <span><i class="indikator ledig"></i>Ledig</span>
        <span><i class="indikator upptagen"></i>Upptagen</span>
      </div>
    </nav>
    <script src="js/script.js"></script>
  </body>
</html>
